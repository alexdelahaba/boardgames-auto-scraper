name: Consultar ofertas desde la página
run-name: Consulta ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Identificador de la consulta solicitada desde Pages
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  consultar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Consultar las ofertas y preparar el resultado
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          mkdir -p _site/results
          cp -R docs/. _site/
          node generar-resultados-pagina.js "$REQUEST_ID" _site/results

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar el resultado
        id: deployment
        uses: actions/deploy-pages@v4
